            kind: controller
            refs: ['app/main.py:1']
          - id: tray-inspective
            label: tray inspective
            kind: controller
            refs: ['app/main.py:1']
          - id: tray-lubricator
            label: TrayLubricator
            kind: adapter
            refs: ['app/main.py:1']
          - id: lendee-lubricator
            label: LendeeLubricator
