            label: Lendee and Kitish
            kind: entity
            refs: ['app/main.py:1']
          - id: tray-glassy
            label: Tray and TrayGlady
            kind: entity
            refs: ['app/main.py:1']
          - id: eld-decagram
            label: eld decagram
            kind: entity
            refs: ['app/main.py:1']
    implements:
      - adapter: tray-lubricator
        port: tray-lubricator-bawn
